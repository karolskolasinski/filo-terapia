          <span

          </a>

            class="text-sm text-gray-500 flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-6"
          >

              href="tel:+48535353274"
              class="font-bold text-slate-800 hover:text-fizjo-600 inline-flex items-center gap-1.5 transition-colors"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-4 h-4 fill-current text-fizjo-600"
                viewBox="0 -960 960 960"
              >
                <path
                  d="M798-120q-125 0-247-54.5T329-329Q226-432 171.5-554T117-798q0-18 12-30t30-12h162q14 0 25 9.5t13 23.5l27 132q2 12-.5 22.5T369-634L261-526q32 56 75.5 102T438-336l106-108q11-11 22.5-13.5T589-455l132 27q14 2 23.5 13t9.5 25v162q0 18-12 30t-30 12Z"
                />

              Zadzwoń: +48 53 53 53 274
            </a>
          </div>
        </div>

        <div
          class="bg-white rounded-2xl p-4 md:p-8 shadow-sm border border-gray-100 relative min-h-162.5 overflow-hidden"
        >
          <!-- iframe loader -->
          <div
            id="iframe_loader"
            class="absolute inset-0 bg-white z-10 flex flex-col items-center justify-center gap-3 transition-opacity duration-300"
          >
            <div
              class="w-10 h-10 border-4 border-fizjo-200 border-t-fizjo-600 rounded-full animate-spin"
            >
            </div>
            <span class="text-sm font-medium text-gray-500">Ładowanie systemu rezerwacji...</span>
          </div>

          <iframe
            id="asysto_iframe"
            src="about:blank"
            class="w-full border-0"
            title="System rezerwacji wizyt FiLO"
          ></iframe>
        </div>
      </section>
    </main>

    <x-footer></x-footer>

    <script>
      AOS.init({
        once: true,
        offset: 100,
        delay: 0,
        duration: 600,
        easing: "ease-in-out",
      });

      const WORKERS = {
        olga: "10015",
        paulina: "10016",
        barbara: "10017",
      };

      const iframe = document.getElementById("asysto_iframe");
      const loader = document.getElementById("iframe_loader");

      const urlParams = new URLSearchParams(window.location.search);
      const profileParam = urlParams.get("profil")?.toLowerCase();

      let targetUrl = "https://wwwfilo-terapia.asysto.pl/rezerwacja";

      if (profileParam && WORKERS[profileParam]) {
        const workerId = WORKERS[profileParam];
        targetUrl = `https://wwwfilo-terapia.asysto.pl/wizyta/krok2/${workerId}`;
      }

      if (iframe && loader) {
        iframe.addEventListener("load", () => {
          loader.classList.add("opacity-0", "pointer-events-none");
          setTimeout(() => loader.remove(), 300);
        });
      }

      window.addEventListener('message', (e) => {
        if (e.data && e.data.hasOwnProperty('iframe_height') && iframe) {
          iframe.style.height = `${e.data.iframe_height}px`;
        }
      });

      window.addEventListener('load', () => {
        if (iframe) {
          iframe.src = targetUrl;
        }
      });
    </script>
  </body>
